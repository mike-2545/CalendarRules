name: Dedicated source secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: python -m pip install detect-secrets==1.5.0
      - name: Scan tracked project files
        shell: bash
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^\.git/|^scripts/reviewed_secret_scan_lines\.json$)' \
            > "$RUNNER_TEMP/detect-secrets.json"
          python - "$RUNNER_TEMP/detect-secrets.json" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          results = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          baseline = json.loads(Path("scripts/reviewed_secret_scan_lines.json").read_text(encoding="utf-8"))["allowed"]
          reviewed = 0
          unknown = []
          for path, rows in results.get("results", {}).items():
              if path.startswith(".git/") or path == "scripts/reviewed_secret_scan_lines.json":
                  unknown.append((path, 0, "scan-exclusion-not-applied"))
                  continue
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              for finding in rows:
                  n = finding["line_number"]
                  actual = (
                      hashlib.sha256(lines[n - 1].strip().encode("utf-8")).hexdigest()
                      if 0 < n <= len(lines) else ""
                  )
                  if baseline.get(f"{path}:{n}") == actual:
                      reviewed += 1
                  else:
                      unknown.append((path, n, finding["type"]))
          print(f"Secret scan: {reviewed} unchanged, individually reviewed synthetic/hash candidates; {len(unknown)} unreviewed.")
          for path, line, kind in unknown:
              print(f"{path}:{line}: {kind}")
          if unknown:
              raise SystemExit("Unreviewed secret candidates block public release.")
          PY
