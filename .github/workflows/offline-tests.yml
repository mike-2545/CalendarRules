name: Full portable test and source audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest cryptography
      - name: Run complete portable regression suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Run tracked-source privacy audit
        run: python scripts/audit_public_source.py
