name: Package CalendarRules 0.4.12 maintenance candidate
on:
  push:
    paths:
      - .github/workflows/package-0.4.12.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record immutable source revision
        run: |
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Build twice and verify the native archives are identical
        run: |
          python scripts/build_store_package.py --output-dir "$RUNNER_TEMP/a" --require-clean
          python scripts/build_store_package.py --output-dir "$RUNNER_TEMP/b" --require-clean
          cmp "$RUNNER_TEMP/a/CalendarRules-0.4.12.zip" "$RUNNER_TEMP/b/CalendarRules-0.4.12.zip"
          cmp "$RUNNER_TEMP/a/CalendarRules-0.4.12.manifest.sha256" "$RUNNER_TEMP/b/CalendarRules-0.4.12.manifest.sha256"
          python - "$RUNNER_TEMP/a/CalendarRules-0.4.12.zip" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.testzip() is None, "ZIP integrity failed"
              paths = zipped.namelist()
              assert paths == sorted(paths), "ZIP entries not sorted"
              assert all(not p.startswith("plugin/") for p in paths)
              for row in zipped.read("PACKAGE_MANIFEST.sha256").decode().splitlines():
                  digest, name = row.split("  ", 1)
                  assert hashlib.sha256(zipped.read(name)).hexdigest() == digest, name
              metadata = json.loads(zipped.read("eisy_google_calendar.iox_plugin.json"))
              assert metadata["plugin"]["version"] == "0.4.12"
              assert b'polyglot.start({"version": "0.4.12", "requestId": False})' in zipped.read("main.py")
              print(f"Verified {len(paths)} ZIP entries and the manifest.")
          print("ZIP_SHA256=" + hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
          mkdir -p dist
          cp "$RUNNER_TEMP/a/CalendarRules-0.4.12.zip" dist/
          cp "$RUNNER_TEMP/a/CalendarRules-0.4.12.manifest.sha256" dist/
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: CalendarRules-0.4.12-maintenance-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 90
